name: Refresh The Farmer prices (weekly)
on:
  workflow_dispatch:
  schedule:
    - cron: "10 6 * * 1"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser and dependencies
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Collect prices
        run: python scrape_farmer.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add farmer_prices.json farmer_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Farmer prices $(date -u +%F)"
            git push
          fi
