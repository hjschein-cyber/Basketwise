name: Refresh The Farmer prices (weekly)
on:
  push:
    paths:
      - '.github/workflows/weekly-farmer.yml'
      - 'scrape_farmer.py'
  workflow_dispatch:
  schedule:
    - cron: "10 6 * * 1"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser and dependencies
        run: |
          python -m pip install "playwright>=1.50,<2"
          python -m playwright install --with-deps chromium
      - name: Collect prices
        run: python scrape_farmer.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add farmer_prices.json farmer_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh Farmer prices $(date -u +%F)"
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then
                echo "Published Farmer snapshot"
                break
              fi
              if [ "$attempt" -eq 5 ]; then
                echo "Could not push after five attempts" >&2
                exit 1
              fi
              sleep 2
            done
          fi
