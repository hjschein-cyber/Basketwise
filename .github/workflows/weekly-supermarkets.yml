name: Refresh Rami Levy and Osher Ad prices (weekly)
on:
  push:
    paths:
      - '.github/workflows/weekly-supermarkets.yml'
      - 'scrape_supermarkets.py'
  workflow_dispatch:
  schedule:
    - cron: "20 7 * * 1"
permissions:
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install price reader
        run: python -m pip install "israeli-prices>=0.2.0,<1"
      - name: Collect verified branch prices
        run: python scrape_supermarkets.py
      - name: Commit changed data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add supermarket_prices.json supermarket_history.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh verified supermarket prices $(date -u +%F)"
            git push
          fi
